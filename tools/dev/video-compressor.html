<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频压缩 - 芝士的摸鱼站</title>
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="../../guides/shared.css">
<style>
.app{max-width:940px;padding-top:32px}.tool-head{margin-bottom:16px}.tool-head h1{font-size:1.45rem;line-height:1.3;margin-bottom:5px}.subtitle{color:var(--text-secondary);font-size:.84rem}.privacy{color:var(--link-color)}
.panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;box-shadow:0 8px 28px var(--card-shadow);padding:22px}
.drop-zone{display:grid;place-items:center;min-height:148px;border:1.5px dashed var(--card-hover-border);border-radius:10px;background:var(--code-bg);padding:24px;text-align:center;transition:.16s}.drop-zone:hover,.drop-zone.dragging{border-color:var(--link-color);background:var(--btn-link-bg)}.drop-zone strong{font-size:1rem}.drop-zone span{display:block;color:var(--text-secondary);font-size:.79rem;margin-top:6px}.file-input{display:none}
.file-info{display:none;grid-template-columns:1.5fr repeat(3,1fr);gap:8px;margin-top:14px}.file-info.show{display:grid}.metric{border:1px solid var(--card-border);border-radius:9px;padding:10px 12px;min-width:0}.metric span{display:block;color:var(--text-tertiary);font-size:.7rem}.metric strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.87rem;margin-top:2px}
.controls{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--card-border)}.controls.show{display:block}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:var(--text-secondary);font-size:.76rem;margin-bottom:6px}.input-wrap{display:flex;align-items:center;border:1px solid var(--card-border);border-radius:9px;background:var(--bg);overflow:hidden}.input-wrap input,.field select{width:100%;height:42px;border:0;background:transparent;color:var(--text);padding:0 12px;font:inherit;outline:0}.input-wrap span{padding:0 12px;color:var(--text-secondary);font-size:.8rem}.field select{border:1px solid var(--card-border);border-radius:9px;background:var(--bg)}
.size-track{position:relative;height:48px;margin:19px 0 10px}.track-line{position:absolute;left:0;right:0;top:21px;height:6px;border-radius:8px;background:var(--code-bg);overflow:hidden}.track-before{height:100%;width:100%;background:linear-gradient(90deg,var(--link-color),var(--link-hover));opacity:.34}.target-pin{position:absolute;top:8px;width:2px;height:30px;background:var(--link-color)}.target-pin:after{content:'目标';position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--link-color);white-space:nowrap}.analysis{font-size:.79rem;color:var(--text-secondary);line-height:1.7;min-height:24px}.analysis.warn{color:#d69a3a}.analysis.bad{color:#d75b75}
.actions{display:flex;gap:9px;align-items:center;margin-top:16px}.btn{min-height:40px;border:1px solid var(--btn-link-border);border-radius:9px;background:var(--btn-link-bg);color:var(--text);padding:0 16px;font:inherit;font-size:.82rem}.btn-primary{border-color:var(--link-color);color:var(--link-color);font-weight:700}.btn[disabled]{opacity:.42;pointer-events:none}.btn-cancel{display:none}.btn-cancel.show{display:inline-flex;align-items:center}
.progress-box{display:none;margin-top:16px}.progress-box.show{display:block}.progress-top{display:flex;justify-content:space-between;color:var(--text-secondary);font-size:.76rem;margin-bottom:7px}.progress{height:8px;border-radius:8px;background:var(--code-bg);overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--link-color),var(--link-hover));transition:width .2s}.status{font-size:.76rem;color:var(--text-tertiary);margin-top:7px}
.result{display:none;margin-top:16px;border:1px solid var(--btn-link-border);border-radius:10px;background:var(--btn-link-bg);padding:14px}.result.show{display:flex;align-items:center;justify-content:space-between;gap:12px}.result strong{font-size:.9rem}.result p{font-size:.75rem;color:var(--text-secondary);margin-top:2px}.note{margin-top:16px;color:var(--text-tertiary);font-size:.72rem;line-height:1.7}
@media(max-width:640px){.panel{padding:15px}.file-info{grid-template-columns:1fr 1fr}.metric:first-child{grid-column:1/-1}.control-grid{grid-template-columns:1fr}.result.show{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg-decor"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
<main class="app">
  <a class="back-link" href="../../index.html">← 返回导航</a>
  <header class="tool-head"><h1>视频压缩</h1><p class="subtitle"><span class="privacy">视频只在本机处理，不会上传。</span> 指定上限，压成通用 MP4。</p></header>
  <section class="panel">
    <label class="drop-zone" id="dropZone"><input class="file-input" id="fileInput" type="file" accept="video/*,.mkv,.avi,.mov,.m4v,.3gp"><div><strong id="dropTitle">拖入视频，或点击选择</strong><span>支持常见视频格式 · 大文件需要较多内存</span></div></label>
    <div class="file-info" id="fileInfo">
      <div class="metric"><span>文件</span><strong id="fileName">—</strong></div><div class="metric"><span>原始大小</span><strong id="fileSize">—</strong></div><div class="metric"><span>时长</span><strong id="duration">—</strong></div><div class="metric"><span>分辨率</span><strong id="resolution">—</strong></div>
    </div>
    <div class="controls" id="controls">
      <div class="control-grid">
        <div class="field"><label for="targetSize">压缩到不超过</label><div class="input-wrap"><input id="targetSize" type="number" min="1" max="4096" step="1" value="50"><span>MB</span></div></div>
        <div class="field"><label for="qualityMode">画面策略</label><select id="qualityMode"><option value="auto">自动推荐</option><option value="keep">保持原分辨率</option><option value="clear">优先清晰（允许降分辨率）</option></select></div>
      </div>
      <div class="size-track"><div class="track-line"><div class="track-before"></div></div><div class="target-pin" id="targetPin"></div></div>
      <p class="analysis" id="analysis"></p>
      <div class="actions"><button class="btn btn-primary" id="startBtn">开始压缩</button><button class="btn btn-cancel" id="cancelBtn">取消</button></div>
      <div class="progress-box" id="progressBox"><div class="progress-top"><span id="stage">准备中</span><strong id="percent">0%</strong></div><div class="progress"><i id="progressBar"></i></div><p class="status" id="status">首次使用需要加载约 31 MB 的转码组件</p></div>
      <div class="result" id="result"><div><strong id="resultTitle">压缩完成</strong><p id="resultMeta"></p></div><a class="btn btn-primary" id="downloadBtn" download>下载 MP4</a></div>
    </div>
    <p class="note">转码速度取决于视频时长、分辨率和电脑性能。浏览器压缩通常慢于桌面软件；建议电脑端处理 1 GB 内、手机端处理 300 MB 内的视频。</p>
  </section>
</main>
<script src="vendor/ffmpeg/ffmpeg.js"></script>
<script src="vendor/ffmpeg/util.js"></script>
<script src="../../guides/shared.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};var file=null,meta=null,ffmpeg=null,resultUrl='',startedAt=0,cancelled=false;
  var drop=$('dropZone'),input=$('fileInput'),target=$('targetSize'),mode=$('qualityMode');
  function bytes(n){if(n>=1073741824)return(n/1073741824).toFixed(2)+' GB';if(n>=1048576)return(n/1048576).toFixed(1)+' MB';return(n/1024).toFixed(1)+' KB'}
  function clock(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function safeName(name){return(name.replace(/\.[^.]+$/,'')||'video')+'-compressed.mp4'}
  function plan(){
    if(!file||!meta)return null;var mb=Math.max(1,Number(target.value)||50),seconds=meta.duration,audio=seconds>3600?64:96;
    var total=Math.floor(mb*1024*1024*8*.945/seconds/1000),video=Math.max(80,total-audio),height=meta.height;
    if(mode.value!=='keep'){
      var recommendedHeight=video>=12000?2160:video>=6500?1440:video>=1800?1080:video>=700?720:480;
      if(mode.value==='clear'&&recommendedHeight<1080&&video>=1200)recommendedHeight=1080;
      height=Math.min(height,recommendedHeight);
    }
    return{mb:mb,audio:audio,video:video,height:height,total:total};
  }
  function updatePlan(){
    var p=plan();if(!p)return;var ratio=Math.min(96,Math.max(3,p.mb/(file.size/1048576)*100));$('targetPin').style.left=ratio+'%';
    var text='预计视频码率 '+p.video+' kbps · 输出 '+(p.height<meta.height?p.height+'p':'保持 '+meta.width+'×'+meta.height)+' · 约需视频时长的 3～15 倍';var cls='analysis';
    if(p.video<250){text+=' · 目标过小，画质可能明显下降';cls+=' bad'}else if(p.video<600){text+=' · 画质会有较明显损失';cls+=' warn'}
    if(file.size>1073741824)text+=' · 文件超过 1 GB，浏览器可能内存不足';$('analysis').className=cls;$('analysis').textContent=text;
  }
  function loadFile(f){if(!f)return;if(!f.type.startsWith('video/')&&!/\.(mkv|avi|mov|m4v|mp4|webm|mpg|mpeg|3gp)$/i.test(f.name)){alert('请选择视频文件');return}cleanupResult();file=f;var url=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=function(){meta={duration:v.duration,width:v.videoWidth,height:v.videoHeight};URL.revokeObjectURL(url);$('fileName').textContent=f.name;$('fileSize').textContent=bytes(f.size);$('duration').textContent=clock(v.duration);$('resolution').textContent=v.videoWidth+'×'+v.videoHeight;$('dropTitle').textContent='已选择 '+f.name;$('fileInfo').classList.add('show');$('controls').classList.add('show');updatePlan()};v.onerror=function(){URL.revokeObjectURL(url);alert('浏览器无法读取这个视频的基础信息，请尝试常见格式或检查文件是否损坏')};v.src=url}
  function cleanupResult(){if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl='';$('result').classList.remove('show')}
  function setProgress(value,label){var n=Math.max(0,Math.min(100,Math.round(value)));$('progressBar').style.width=n+'%';$('percent').textContent=n+'%';if(label)$('stage').textContent=label;if(startedAt&&n>3){var elapsed=(Date.now()-startedAt)/1000,remain=elapsed/n*(100-n);$('status').textContent='已用 '+clock(elapsed)+' · 预计剩余 '+clock(remain)}}
  async function ensureFFmpeg(){
    if(ffmpeg)return;if(location.protocol==='file:')throw new Error('视频组件不能通过 file:// 直接运行，请使用本地 HTTP 服务或部署后访问');var FFmpeg=FFmpegWASM.FFmpeg,base=new URL('vendor/ffmpeg/',location.href);ffmpeg=new FFmpeg();
    ffmpeg.on('progress',function(e){if(!cancelled)setProgress(8+e.progress*84,'正在压缩')});$('status').textContent='正在加载转码组件（约 31 MB）';
    await ffmpeg.load({classWorkerURL:new URL('814.ffmpeg.js',base).href,coreURL:new URL('ffmpeg-core.js',base).href,wasmURL:new URL('ffmpeg-core.wasm',base).href});
  }
  async function encode(p,attempt){
    var ext=(file.name.match(/\.([a-z0-9]+)$/i)||[])[1]||'mp4',inName='input.'+ext,outName='output-'+attempt+'.mp4';if(attempt===1)await ffmpeg.writeFile(inName,await FFmpegUtil.fetchFile(file));
    var args=['-i',inName,'-map','0:v:0','-map','0:a:0?','-c:v','libx264','-preset','veryfast','-b:v',p.video+'k','-maxrate',p.video+'k','-bufsize',(p.video*2)+'k'];
    if(p.height<meta.height)args.push('-vf','scale=-2:'+p.height);args.push('-pix_fmt','yuv420p','-c:a','aac','-b:a',p.audio+'k','-movflags','+faststart','-y',outName);await ffmpeg.exec(args);var data=await ffmpeg.readFile(outName);await ffmpeg.deleteFile(outName);return new Blob([data.buffer],{type:'video/mp4'})
  }
  async function start(){
    if(!file||!meta)return;var p=plan(),limit=p.mb*1048576;if(file.size<=limit){$('analysis').className='analysis warn';$('analysis').textContent='原视频已经小于目标大小，无需重复转码';return}
    cancelled=false;startedAt=Date.now();cleanupResult();$('startBtn').disabled=true;$('cancelBtn').classList.add('show');$('progressBox').classList.add('show');setProgress(1,'加载组件');
    try{await ensureFFmpeg();if(cancelled)return;setProgress(7,'写入视频');var blob=await encode(p,1);if(cancelled)return;
      if(blob.size>limit){setProgress(8,'自动校准大小');var factor=Math.max(.55,limit/blob.size*.96);p.video=Math.max(80,Math.floor(p.video*factor));blob=await encode(p,2)}
      if(cancelled)return;setProgress(100,'压缩完成');resultUrl=URL.createObjectURL(blob);$('downloadBtn').href=resultUrl;$('downloadBtn').download=safeName(file.name);$('resultTitle').textContent=blob.size<=limit?'压缩完成，已控制在目标内':'压缩完成，但仍略超目标';$('resultMeta').textContent=bytes(file.size)+' → '+bytes(blob.size)+' · 用时 '+clock((Date.now()-startedAt)/1000);$('result').classList.add('show')
    }catch(err){console.error(err);var detail=err&&err.message?err.message:String(err);$('stage').textContent='压缩失败';$('status').textContent=/memory|allocate/i.test(detail)?'浏览器内存不足，请换电脑或处理更小的视频':'失败原因：'+detail+'。请检查网络，或换用 Chrome / Edge 重试'}finally{$('startBtn').disabled=false;$('cancelBtn').classList.remove('show')}
  }
  function cancel(){cancelled=true;if(ffmpeg){ffmpeg.terminate();ffmpeg=null}$('stage').textContent='已取消';$('status').textContent='临时转码任务已停止';$('startBtn').disabled=false;$('cancelBtn').classList.remove('show')}
  drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('dragging')});drop.addEventListener('dragleave',function(){drop.classList.remove('dragging')});drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});input.addEventListener('change',function(){loadFile(input.files[0])});target.addEventListener('input',updatePlan);mode.addEventListener('change',updatePlan);$('startBtn').addEventListener('click',start);$('cancelBtn').addEventListener('click',cancel);window.addEventListener('beforeunload',cleanupResult)
})();
</script>
</body>
</html>
